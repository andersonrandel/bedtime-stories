<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedtime Stories</title>
  <meta name="description" content="A cozy collection of bedtime stories to drift off to.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="moon-orb" aria-hidden="true"></div>

  <header class="hero">
    <h1>Bedtime Stories</h1>
    <p class="tagline">A little garden of tales to read before you drift off to sleep.</p>
  </header>

  <main class="carousel-section">
    <h2 class="carousel-heading">Tonight's Collection</h2>
    <div class="carousel-wrap">
      <button class="nav-btn" id="prev" aria-label="Previous story">‹</button>
      <div class="carousel" id="carousel" aria-label="Story cards"></div>
      <button class="nav-btn" id="next" aria-label="Next story">›</button>
    </div>
  </main>

  <footer>
    <p>Sweet dreams. 🌙 Made with love.</p>
  </footer>

  <!-- decorative flower garden -->
  <div class="ground" aria-hidden="true"></div>
  <div class="garden" aria-hidden="true"></div>

  <script src="assets/js/stories.js"></script>
  <script src="assets/js/flowers.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
